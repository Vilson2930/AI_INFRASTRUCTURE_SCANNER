name: AI Infrastructure Scanner

on:

  # Permite executar manualmente pela aba Actions
  workflow_dispatch:

  # Executa de segunda a sexta às 20h30 de Brasília
  # O cron do GitHub usa UTC: 23h30 UTC = 20h30 BRT
  schedule:
    - cron: "30 23 * * 1-5"

permissions:
  contents: read

jobs:
  run-scanner:

    name: Executar Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ------------------------------------------------------
      # 1. BAIXAR O REPOSITÓRIO
      # ------------------------------------------------------
      - name: Baixar código
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # 2. CONFIGURAR PYTHON
      # ------------------------------------------------------
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ------------------------------------------------------
      # 3. INSTALAR DEPENDÊNCIAS
      # ------------------------------------------------------
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ------------------------------------------------------
      # 4. PREPARAR PASTAS
      # ------------------------------------------------------
      - name: Preparar pastas
        run: |
          mkdir -p data
          mkdir -p reports

      # ------------------------------------------------------
      # 5. VERIFICAR SINTAXE DOS ARQUIVOS
      # ------------------------------------------------------
      - name: Verificar código Python
        run: |
          python -m compileall config engine main.py app.py send_email.py

      # ------------------------------------------------------
      # 6. EXECUTAR O SCANNER
      # ------------------------------------------------------
      - name: Executar scanner
        run: |
          python main.py

      # ------------------------------------------------------
      # 7. GERAR RELATÓRIO PDF
      # ------------------------------------------------------
      - name: Gerar relatório institucional PDF
        timeout-minutes: 3
        run: |
          python -c "from engine.pdf_report import gerar_pdf_institucional; gerar_pdf_institucional()"

      # ------------------------------------------------------
      # 8. VERIFICAR PDF
      # ------------------------------------------------------
      - name: Verificar relatório PDF
        run: |
          echo "Arquivos em reports:"
          ls -lah reports

          test -f reports/relatorio_ai_infrastructure_scanner.pdf

      # ------------------------------------------------------
      # 9. ENVIAR RELATÓRIO POR E-MAIL
      # ------------------------------------------------------
      - name: Enviar relatório por e-mail
        if: success()
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python send_email.py

      # ------------------------------------------------------
      # 10. MOSTRAR ARQUIVOS GERADOS
      # ------------------------------------------------------
      - name: Listar resultados
        if: always()
        run: |
          echo "Arquivos encontrados em data:"
          find data -maxdepth 2 -type f -print || true

          echo ""
          echo "Arquivos encontrados em reports:"
          find reports -maxdepth 2 -type f -print || true

      # ------------------------------------------------------
      # 11. DISPONIBILIZAR RESULTADOS PARA DOWNLOAD
      # ------------------------------------------------------
      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-infrastructure-scanner-results
          path: |
            data/*.csv
            data/*.xlsx
            reports/*.pdf
          if-no-files-found: warn
          retention-days: 30
